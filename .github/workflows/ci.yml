name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-xss-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write malicious JUnit report
        run: echo "" | base64 -d > malicious-report.xml
        id: tests
        continue-on-error: true
      - name: Mergify CI Upload
        if: success() || failure()
        uses: mergifyio/gha-mergify-ci@v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: malicious-report.xml
          test_step_outcome: ${{ steps.tests.outcome }}
